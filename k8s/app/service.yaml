---
apiVersion: v1
kind: Service
metadata:
  name: diplom-app
  namespace: default
  labels:
    app: diplom-app
spec:
  type: NodePort
  selector:
    app: diplom-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http

---
# Ingress для доступа через LoadBalancer или nginx ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diplom-app
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: diplom-app
                port:
                  number: 80
